<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <meta name="description" content="眩晕天梯：3D 悬空跑酷挑战。叠加风险倍率，击败自己的残影。">
  <title>眩晕天梯 / VERTIGO</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./game3d.css">
</head>
<body data-screen="play">
  <div class="noise" aria-hidden="true"></div>
  <main>
    <header><a id="brand" href="#" aria-label="眩晕天梯首页"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 5h8l5 16L21 5h8L19 29h-6z" fill="currentColor"/></svg><b>VERTIGO<span>眩晕天梯</span></b></a><nav aria-label="主导航"><button class="nav-active" id="nav-play">攀登</button><button id="nav-board">天梯</button><button id="nav-records">纪录</button><button id="nav-settings" aria-label="设置">设置 <span>↗</span></button></nav><div class="system-status"><i></i> SYSTEM READY</div></header>
    <section id="play">
      <div class="play-header"><div><p class="eyebrow" id="game-mode">SCORE ATTACK</p><h2 id="game-stage">第 01 阶 <span>地基</span></h2></div><div class="play-header-right"><span id="seed-label"></span><button id="pause" class="square" aria-label="暂停">Ⅱ</button></div></div>
      <div class="arena-layout"><aside class="stat-panel"><p class="eyebrow">CURRENT SCORE</p><strong id="score">0</strong><div class="stat-row"><span>个人纪录</span><b id="pb">—</b></div><div class="stat-row"><span>风险倍率</span><b id="risk" class="lime">×1.0</b></div><div class="stat-row"><span>剩余生命</span><b id="lives">● ● ●</b></div><div class="stat-row"><span>连击</span><b id="combo">×0</b></div><p class="panel-note" id="mode-note"></p></aside>
      <div class="arena"><div class="arena-top"><span id="phase">准备好了就上</span><span id="timer">00.00s</span></div><canvas id="arena" width="900" height="650" tabindex="0" aria-label="3D 天梯跑酷：左右移动，空格起跳"></canvas><div class="hit-message" id="hit-message" role="status" aria-live="polite"></div><div class="arena-bottom"><span id="progress">平台 0 / 8</span><span id="precision">精度 —</span></div><div class="run-controls"><button id="move-left" aria-label="向左移动">◀</button><button id="strike" class="primary strike">跳跃 <span>SPACE ↗</span></button><button id="move-right" aria-label="向右移动">▶</button></div><p class="input-note">A D / ← → 移动 · 空格跳跃 <i>·</i> P 暂停</p></div>
      <aside class="right-panel"><p class="eyebrow">CLIMB PROTOCOL</p><div class="ladder" id="ladder"></div><div class="legend"><span><i class="target-key"></i>悬空平台</span><span><i class="perfect-key"></i>最佳落点</span><span><i class="ghost-key"></i>最佳残影</span></div><p class="panel-note" id="ghost-note">操作很简单。<br>时机不简单。</p></aside></div>
    </section>
    <section id="records" class="hidden content-page"></section>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <button id="fullscreen" aria-label="进入全屏" title="全屏">⛶ <span>全屏</span></button>
  <link rel="stylesheet" href="./mobile.css">
  <script type="module" src="./app.js"></script>
</body>
</html>
